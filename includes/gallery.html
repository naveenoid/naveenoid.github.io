                <div class="collage-item" onclick="openModal(this)" data-description="Punyo-1 is a soft tactile-sensing upper-body robot designed for whole-body manipulation and physical human interaction. Using dense tactile skin across its torso and arms, Punyo-1 demonstrates non-prehensile 'hugging' strategies for safely carrying large, bulky objects. This platform explores how compliant robot bodies with rich haptic feedback enable safer and more versatile manipulation in human environments. (2022)">

                <div class="collage-item" onclick="openModal(this)" data-description="The Soft-bubble gripper is a highly deformable, vision-based tactile sensor that uses internal RGBD cameras to track dense surface deformation. By mounting cameras inside compliant bubble membranes, the gripper achieves high-fidelity geometry sensing while maintaining the safety and compliance benefits of soft robot interfaces. This design enables both robust grasping and perceptive manipulation through rich tactile feedback. (2020)">

                <div class="collage-item" onclick="openModal(this)" data-description="PolyTouch is a robust multi-modal tactile sensor that combines tactile, acoustic, and peripheral vision sensing in a single robot finger. This integrated design demonstrates how rich haptic feedback from multiple modalities provides essential inductive biases for robot learning in contact-rich manipulation tasks. Winner of the ICRA 2025 Best Paper Award in Field and Service Robotics. (2025)">
                    <img src="images/polytouch_with_tool.jpg" alt="PolyTouch">

                </div>
                <div class="collage-item" onclick="openModal(this)" data-description="The iCub is a 1-meter tall open-source humanoid robot platform designed for research in embodied cognition and developmental robotics. With 53 degrees of freedom and rich sensory capabilities, iCub has been instrumental in studying human-robot interaction, whole-body control, and learning algorithms. This photo is from my work at the Italian Institute of Technology developing whole-body state estimation using distributed IMUs and force sensors. (2012)">

                <div class="collage-item" onclick="openModal(this)" data-description="Poochi is a 1-inch cubed microrobot I built for the 13th International Microrobot Maze Contest in 2024. Despite its tiny size, Poochi achieved finalist status in the competition and won the Best Documentation Award. The robot demonstrates precision control and sensor integration at the micro-scale, navigating complex maze environments autonomously. (2024)">
                    <img src="images/poochi_palmtop.jpg" alt="Poochi Micro">
