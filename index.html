<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Naveen Kuppuswamy | Roboticist</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <link rel="stylesheet" type="text/css" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="js/includes.js"></script>
    <!-- GoatCounter Analytics (private dashboard at naveenoid.goatcounter.com) -->
    <script data-goatcounter="https://naveenoid.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</head>
<body>
    <main class="main-wrap">
        <!-- Header Section -->
        <div data-include="includes/header.html"></div>

        <!-- About Section -->
        <div data-include="includes/about.html"></div>

        <!-- Highlighted Publications Section -->
        <div data-include="includes/highlighted-publications.html"></div>

        <!-- All Publications Section -->
        <div data-include="includes/publications.html"></div>

        <!-- Acknowledged Contributions Section -->
        <div data-include="includes/acknowledged-contributions.html"></div>

        <!-- Patents Section -->
        <div data-include="includes/patents.html"></div>

        <!-- Talks Section -->
        <div data-include="includes/talks.html"></div>

        <!-- Gallery Section -->
        <div data-include="includes/gallery.html"></div>

        <!-- Footer -->
        <footer style="margin-top: 80px; text-align: right; font-size: 0.8rem; color: #999; border-top: 1px solid #eee; padding: 20px 0;">
            Last updated: January 2025
        </footer>
    </main>
    <!-- Floating Navigation Menu -->
    <nav id="floating-nav" aria-label="Page navigation">
        <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">↑ Top</a>
        <a href="#selected-publications">Featured</a>
        <a href="#all-publications">Publications</a>
        <a href="#acknowledged-contributions">Acknowledged</a>
        <a href="#patents">Patents</a>
        <a href="#talks">Talks</a>
        <a href="#gallery">Gallery</a>
    </nav>

    <style>
    #floating-nav {
        position: fixed;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255,255,255,0.97);
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 10px 6px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        z-index: 999;
        opacity: 0;
        transition: opacity 0.3s;
    }
    #floating-nav.visible {
        opacity: 1;
    }
    #floating-nav a {
        font-size: 0.7rem;
        font-weight: 500;
        color: #777;
        text-decoration: none;
        padding: 5px 14px;
        border-radius: 12px;
        transition: background 0.15s, color 0.15s;
        white-space: nowrap;
        letter-spacing: 0.01em;
        display: block;
    }
    #floating-nav a:hover {
        background: #f5f5f5;
        color: #222;
    }
    #floating-nav a.active {
        background: #f0f0f0;
        color: #333;
        font-weight: 600;
    }
    @media (max-width: 720px) {
        #floating-nav {
            top: auto;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            flex-direction: row;
            padding: 7px 10px;
            gap: 0;
            border-radius: 24px;
            white-space: nowrap;
            overflow-x: auto;
            max-width: calc(100vw - 32px);
        }
        #floating-nav a {
            padding: 5px 9px;
            font-size: 0.65rem;
        }
    }
    </style>

    <script>
    (function() {
        var nav = document.getElementById('floating-nav');
        var links = nav.querySelectorAll('a');
        var sections = [];

        window.addEventListener('scroll', function() {
            nav.classList.toggle('visible', window.scrollY > 120);
        }, { passive: true });

        function buildSections() {
            sections = [];
            links.forEach(function(a) {
                var href = a.getAttribute('href');
                if (href && href.startsWith('#') && href.length > 1) {
                    var el = document.getElementById(href.slice(1));
                    if (el) sections.push({ link: a, el: el });
                }
            });
        }

        function updateActive() {
            if (!sections.length) buildSections();
            var scrollY = window.scrollY + 80;
            var current = null;
            sections.forEach(function(s) {
                if (s.el.offsetTop <= scrollY) current = s;
            });
            links.forEach(function(a) { a.classList.remove('active'); });
            if (current) current.link.classList.add('active');
        }

        window.addEventListener('scroll', updateActive, { passive: true });
        window.addEventListener('load', function() { buildSections(); updateActive(); });
    })();
    </script>
</body>
</html>
